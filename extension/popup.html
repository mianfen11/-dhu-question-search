<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库收集器</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>学生手册题目收集</h1>
  <p>仅保存在此浏览器，不上传。请正常登录原站，保持题库标签页打开。</p>
  <dl>
    <div><dt>已收集</dt><dd id="total">—</dd></div>
    <div><dt>单选题</dt><dd id="one_choice">—</dd></div>
    <div><dt>多选题</dt><dd id="multi_choice">—</dd></div>
    <div><dt>判断题</dt><dd id="judge">—</dd></div>
    <div><dt>待核对冲突</dt><dd id="conflicts">—</dd></div>
  </dl>
  <section aria-label="当前标签页诊断"><strong id="diagnostic-status" role="status">正在检查监听状态…</strong><p id="diagnostic-detail"></p></section>
  <section class="queue" aria-label="收集计划">
    <h2>自动收集计划</h2>
    <p id="queue-permission">自动化已获用户授权。默认间隔 5 秒、1 轮；保持目标标签页打开，弹窗可关闭。</p>
    <button id="auto-start" type="button">开始自动收集</button>
    <label>手册（可从当前页面识别） <select id="queue-manual" aria-label="计划手册"></select></label>
    <label>轮数 <input id="queue-rounds" type="number" min="1" max="10" value="1"></label>
    <label>请求间隔（秒，至少5）<input id="auto-interval" type="number" min="5" max="86400" value="5"></label>
    <div class="actions"><button id="queue-start" type="button">仅离线记录</button><button id="queue-pause" type="button">暂停</button><button id="queue-resume" type="button">继续</button><button id="queue-stop" type="button">停止</button></div>
    <p id="queue-status" role="status">请先在原站正常打开章节列表。</p>
    <div class="table-wrap"><table><thead><tr><th>手册/章节</th><th>总/单/多/判</th></tr></thead><tbody id="chapter-progress"></tbody></table></div>
  </section>
  <section aria-label="本地存储诊断"><h2>存储诊断</h2><p id="storage-diagnostic" role="status">正在读取…</p><button id="recover-storage" type="button" disabled>恢复待提交回执（不发送新请求）</button></section>
  <p id="saved">尚未读取本地题库</p>
  <p id="storage-error" role="alert"></p>
  <div class="actions"><button id="export" type="button">导出 JSON</button><button id="import" type="button">导入 JSON</button><button id="refresh" type="button">刷新统计</button></div>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <p id="message" role="status" aria-live="polite"></p>
  <p class="note">数量代表已保存的不同题目，不代表完整题库。相同题目跨章节合并，保留章节来源；选项或答案冲突分别保留。</p>
  <script src="popup.js"></script>
</body></html>
